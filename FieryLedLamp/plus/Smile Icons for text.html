<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Иконки, смайлики</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f1115;
            color: #e2e8f0;
            font-family: 'Segoe UI', 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        h1 span {
            color: #3873f8;
        }
        h1 .badge {
            font-size: 0.9rem;
            background: #1e293b;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            color: #94a3b8;
            font-weight: 400;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            border-left: 4px solid #3887f8;
            padding-left: 1rem;
            font-size: 1.1rem;
        }
        .search-box {
            background: #1e293b;
            border-radius: 60px;
            padding: 0.4rem 0.4rem 0.4rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid #334155;
            max-width: 500px;
        }
        .search-box input {
            background: transparent;
            border: none;
            padding: 0.9rem 0;
            font-size: 1.1rem;
            color: #f1f5f9;
            width: 100%;
            outline: none;
        }
        .search-box input::placeholder {
            color: #475569;
        }
        .search-box button {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }
        .categories {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .categories button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .categories button:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }
        .categories button.active {
            background: #475bbd;
            color: #ffffff;
            border-color: #475bbd;
        }
        .categories button.shop-cat {
            background: #1e3a4f;
            border-color: #2d6a8f;
            color: #7dd3fc;
        }
        .categories button.shop-cat:hover {
            background: #1e4a6f;
            color: #b8e2ff;
        }
        .categories button.shop-cat.active {
            background: #2d7abf;
            border-color: #3b8fd9;
            color: #ffffff;
        }
        .categories button.circus-cat {
            background: #3a1e3f;
            border-color: #7a3f8a;
            color: #e8b4f8;
        }
        .categories button.circus-cat:hover {
            background: #4a2a5f;
            color: #f0c8ff;
        }
        .categories button.circus-cat.active {
            background: #8a3faf;
            border-color: #a85fc8;
            color: #ffffff;
        }
        .categories button.juggling-cat {
            background: #1e3a3f;
            border-color: #2d7a8a;
            color: #7dd8fc;
        }
        .categories button.juggling-cat:hover {
            background: #1e4a5f;
            color: #a8e8ff;
        }
        .categories button.juggling-cat.active {
            background: #2d8abf;
            border-color: #4aa8d9;
            color: #ffffff;
        }
        .categories button.fire-cat {
            background: #3f2a1e;
            border-color: #8a5a2a;
            color: #f8c878;
        }
        .categories button.fire-cat:hover {
            background: #5a3a2a;
            color: #ffd890;
        }
        .categories button.fire-cat.active {
            background: #bf7a2d;
            border-color: #d99a4a;
            color: #ffffff;
        }
        .categories button.internet-cat {
            background: #1a2a3f;
            border-color: #2d6a9f;
            color: #7dc8fc;
        }
        .categories button.internet-cat:hover {
            background: #1a3a5f;
            color: #b0e0ff;
        }
        .categories button.internet-cat.active {
            background: #2d7abf;
            border-color: #4a9ad9;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        .icon-card {
            background: #1e293b;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .icon-card:hover {
            background: #263348;
            border-color: #334155;
        }
        .icon-card .emoji {
            font-size: 1.8rem;
            line-height: 1;
            min-width: 40px;
            text-align: center;
        }
        .icon-card .name {
            color: #94a3b8;
            font-size: 0.85rem;
            flex: 1;
        }
        .icon-card .code-preview {
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.75rem;
            background: #0b111e;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        .icon-card.selected {
            border-color: #3b7189;
            background: #263348;
        }
        .icon-card .copy-badge {
            font-size: 0.6rem;
            background: #38bdf820;
            color: #7dd3fc;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            opacity: 0;
            transition: 0.2s;
        }
        .icon-card:hover .copy-badge {
            opacity: 1;
        }

        .code-section {
            background: #0b0f17;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            border: 1px solid #2d3a4f;
        }
        .code-section h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        .code-section h3 span {
            color: #838b8f;
        }

        .code-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .code-tabs button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .code-tabs button.active {
            background: #475bbd;
            color: #ffffff;
        }
        .code-tabs button:hover:not(.active) {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .code-output {
            background: #0b111e;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            overflow-x: auto;
            color: #e2e8f0;
            border: 1px solid #263348;
            min-height: 60px;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .code-output .preview-emoji {
            font-size: 2rem;
        }
        .code-output .preview-code {
            color: #38bdf8;
            font-weight: 600;
        }

        .copy-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .copy-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.6rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .copy-btn.secondary {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .copy-btn.secondary:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #38bdf8;
            color: #0f172a;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
            font-size: 1.1rem;
        }
        .toast.show {
            opacity: 1;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #64748b;
            grid-column: 1 / -1;
        }
        .empty span {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }

        .stats {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .stats span {
            color: #38bdf8;
            font-weight: 600;
        }

        .shop-tip {
            display: inline-block;
            background: #1e3a4f;
            color: #7dd3fc;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .code-output {
                font-size: 0.9rem;
                flex-wrap: wrap;
            }
            .copy-row {
                flex-direction: column;
            }
            .copy-btn {
                width: 100%;
                text-align: center;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>🛍️</span> Иконки, смайлики для <span>вставки в текст, код</span>
        </h1>

        <div class="search-box">
            <span style="font-size:1.2rem;">🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск по названию или описанию..." />
            <button id="searchBtn">Найти</button>
        </div>

        <div class="categories" id="categories">
            <button class="active" data-category="all">📌 Все</button>
            <button class="shop-cat" data-category="shop">🛍️ Магазин</button>
            <button data-category="status">✔️ Статусы</button>
            <button data-category="arrows">➡️ Стрелки</button>
            <button data-category="shapes">🔷 Формы</button>
            <button data-category="objects">📦 Объекты</button>
            <button data-category="symbols">🔣 Символы</button>
            <button data-category="numbers">🔢 Цифры</button>
            <button data-category="stars">⭐ Звёзды</button>
            <button data-category="hand">✋ Руки</button>
            <button data-category="faces">😊 Лица</button>
            <button class="circus-cat" data-category="circus">🎪 Цирк</button>
            <button class="juggling-cat" data-category="juggling">🤹 Жонглёры</button>
            <button class="fire-cat" data-category="fire">🔥 Фаер</button>
            <button class="internet-cat" data-category="internet">🌐 Интернет</button>
        </div>

        <div class="stats" id="stats">Всего значков: <span id="totalCount">0</span></div>

        <div class="grid" id="iconGrid"></div>

        <div class="code-section">
            <h3><span>Код для вставки</span></h3>
            <div class="code-tabs">
                <button class="active" data-format="emoji">Эмодзи (текст)</button>
                <button data-format="unicode">Unicode (U+XXXX)</button>
                <button data-format="js">JavaScript / JSON</button>
                <button data-format="cpp">C++ (raw string)</button>
                <button data-format="html">HTML (&#xxxx;)</button>
            </div>
            <div class="code-output" id="codeOutput">
                <span class="preview-emoji"></span>
                <span class="preview-code">Кликните на значок</span>
            </div>
            <div class="copy-row">
                <button class="copy-btn" id="copyBtn">Копировать</button>
                <button class="copy-btn secondary" id="copyText">Копировать + название</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Скопировано!</div>

            { emoji: '🕸️', name: 'spider-web', category: 'internet', desc: 'Паутина / Всемирная паутина' },
            { emoji: '💾', name: 'save-internet', category: 'internet', desc: 'Сохранить / Дискета' },
            { emoji: '💿', name: 'cd-internet', category: 'internet', desc: 'CD-диск' },
            { emoji: '📀', name: 'dvd-internet', category: 'internet', desc: 'DVD-диск' },
            { emoji: '📹', name: 'video-camera', category: 'internet', desc: 'Видеокамера / Запись' },
            { emoji: '📽️', name: 'film-projector', category: 'internet', desc: 'Проектор / Фильм' },
            { emoji: '🎬', name: 'clapper-board', category: 'internet', desc: 'Хлопушка / Медиа' },
            { emoji: '📺', name: 'television', category: 'internet', desc: 'Телевизор / Трансляция' },
            { emoji: '📻', name: 'radio', category: 'internet', desc: 'Радио / Вещание' },
            { emoji: '🎧', name: 'headphones', category: 'internet', desc: 'Наушники / Аудио' },
            { emoji: '🔊', name: 'speaker-internet', category: 'internet', desc: 'Громкоговоритель / Звук' },
            { emoji: '🔔', name: 'notification-internet', category: 'internet', desc: 'Уведомление' },
            { emoji: '📎', name: 'attachment-internet', category: 'internet', desc: 'Вложение / Скрепка' },
            { emoji: '✏️', name: 'edit-internet', category: 'internet', desc: 'Редактировать' },
            { emoji: '📝', name: 'note-internet', category: 'internet', desc: 'Заметка / Текст' },
            { emoji: '📋', name: 'clipboard-internet', category: 'internet', desc: 'Буфер обмена' },
            { emoji: '🗑️', name: 'trash-internet', category: 'internet', desc: 'Удалить / Корзина' },
            { emoji: '🕹️', name: 'joystick', category: 'internet', desc: 'Джойстик / Игры' },
            { emoji: '🏷️', name: 'tag-internet', category: 'internet', desc: 'Метка / Тег' },
            { emoji: '🔗', name: 'link-internet', category: 'internet', desc: 'Ссылка / Гиперссылка' },
            { emoji: '🔒', name: 'lock-internet', category: 'internet', desc: 'Замок / Безопасность' },
            { emoji: '🔓', name: 'unlock-internet', category: 'internet', desc: 'Открыто / Разблокировано' },
            { emoji: '🔐', name: 'secure-lock', category: 'internet', desc: 'Безопасное соединение' },
            { emoji: '🛡️', name: 'shield-internet', category: 'internet', desc: 'Щит / Защита' },
            { emoji: '🔍', name: 'search-internet', category: 'internet', desc: 'Поиск (лупа)' },
            { emoji: '🔎', name: 'search-detail-internet', category: 'internet', desc: 'Детальный поиск' },
        ];

        const grid = document.getElementById('iconGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const codeOutput = document.getElementById('codeOutput');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');
        const tabs = document.querySelectorAll('.code-tabs button');
        const categoryBtns = document.querySelectorAll('.categories button');
        const toast = document.getElementById('toast');
        const totalCount = document.getElementById('totalCount');

        let selectedIcon = null;
        let currentFormat = 'emoji';
        let currentCategory = 'all';

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function getEmojiUnicode(emoji) {
            if (!emoji) return '';
            const code = emoji.codePointAt(0);
            return 'U+' + code.toString(16).toUpperCase().padStart(4, '0');
        }

        function getHtmlEntity(emoji) {
            if (!emoji) return '';
            const code = emoji.codePointAt(0);
            return '&#' + code + ';';
        }

        function getFormattedCode(icon, format) {
            if (!icon) return '';
            const emoji = icon.emoji;
            switch (format) {
                case 'emoji':
                    return emoji;
                case 'unicode':
                    return getEmojiUnicode(emoji);
                case 'js':
                    return `"${emoji}"`;
                case 'cpp':
                    return `R"(${emoji})"`;
                case 'html':
                    return getHtmlEntity(emoji);
                default:
                    return emoji;
            }
        }

        function renderIcons(filter = '', category = 'all') {
            let filtered = ICONS;

            if (filter) {
                const q = filter.toLowerCase().trim();
                filtered = filtered.filter(icon =>
                    icon.name.toLowerCase().includes(q) ||
                    icon.emoji.includes(q) ||
                    icon.desc.toLowerCase().includes(q)
                );
            }

            if (category !== 'all') {
                filtered = filtered.filter(icon => icon.category === category);
            }

            totalCount.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML =
                    `<div class="empty"><span>🔍</span><p>Ничего не найдено</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(icon => `
                    <div class="icon-card ${selectedIcon && selectedIcon.name === icon.name ? 'selected' : ''}" 
                         data-name="${icon.name}" 
                         onclick="selectIcon('${icon.name}')">
                        <span class="emoji">${icon.emoji}</span>
                        <span class="name">${icon.name}</span>
                        <span class="code-preview">${icon.emoji}</span>
                        <span class="copy-badge"></span>
                    </div>
                `).join('');
        }

        window.selectIcon = function(name) {
            const icon = ICONS.find(i => i.name === name);
            if (!icon) return;

            selectedIcon = icon;
            document.querySelectorAll('.icon-card').forEach(el => el.classList.remove('selected'));
            const card = document.querySelector(`[data-name="${name}"]`);
            if (card) card.classList.add('selected');
            updateCodeOutput();
            showToast(`${icon.emoji}  ${icon.name}`);
        };

        function updateCodeOutput() {
            if (!selectedIcon) {
                codeOutput.innerHTML = `
                        <span class="preview-emoji"></span>
                        <span class="preview-code">Кликните на значок</span>
                    `;
                return;
            }

            const code = getFormattedCode(selectedIcon, currentFormat);
            codeOutput.innerHTML = `
                    <span class="preview-emoji">${selectedIcon.emoji}</span>
                    <span class="preview-code">${code}</span>
                `;
        }

        function copyCode() {
            if (!selectedIcon) {
                showToast('Сначала выберите значок');
                return;
            }

            const code = getFormattedCode(selectedIcon, currentFormat);

            const input = document.createElement('input');
            input.value = code;
            input.style.position = 'fixed';
            input.style.left = '-9999px';
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast(`Скопировано: ${code}`);
            } catch (_) {
                document.body.removeChild(input);
                showToast('Ошибка копирования');
            }
        }

        function copyWithName() {
            if (!selectedIcon) {
                showToast('Сначала выберите значок');
                return;
            }

            const text = `${selectedIcon.emoji}  ${selectedIcon.name}`;

            const input = document.createElement('input');
            input.value = text;
            input.style.position = 'fixed';
            input.style.left = '-9999px';
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999);

            try {
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast(`Скопировано: ${text}`);
            } catch (_) {
                document.body.removeChild(input);
                showToast('Ошибка копирования');
            }
        }

        searchBtn.addEventListener('click', () => {
            renderIcons(searchInput.value, currentCategory);
        });
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') renderIcons(searchInput.value, currentCategory);
        });
        searchInput.addEventListener('input', () => {
            renderIcons(searchInput.value, currentCategory);
        });

        categoryBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                categoryBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderIcons(searchInput.value, currentCategory);
            });
        });

        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFormat = this.dataset.format;
                if (selectedIcon) updateCodeOutput();
            });
        });

        copyBtn.addEventListener('click', copyCode);
        copyText.addEventListener('click', copyWithName);

        renderIcons('', 'all');

        setTimeout(() => {
            const firstShop = document.querySelector('[data-name="globe-internet"]') ||
                document.querySelector('[data-name="cart"]') ||
                document.querySelector('[data-name="delivery-truck"]') ||
                document.querySelector('.icon-card');
            if (firstShop) {
                firstShop.click();
            }
        }, 150);
    </script>
</body>
</html>
