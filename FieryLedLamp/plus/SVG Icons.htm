<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SVG Icons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        h1 i {
            color: #3873f8;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            padding-left: 1rem;
        }
        .search-box {
            background: #1e293b;
            border-radius: 60px;
            padding: 0.4rem 0.4rem 0.4rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border: 1px solid #334155;
            max-width: 500px;
        }
        .search-box input {
            background: transparent;
            border: none;
            padding: 0.9rem 0;
            font-size: 1.1rem;
            color: #f1f5f9;
            width: 100%;
            outline: none;
        }
        .search-box input::placeholder {
            color: #475569;
        }
        .search-box button {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            transition: 0.2s;
        }
        .search-box button:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .icon-card {
            background: #1e293b;
            padding: 1rem 0.5rem;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .icon-card:hover {
            background: #263348;
            transform: translateY(-2px);
        }
        .icon-card svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #e2e8f0;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icon-card:hover svg {
            stroke: #38bdf8;
        }
        .icon-card .name {
            display: block;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 0.5rem;
        }
        .icon-card.selected {
            border-color: #3b7189;
            background: #263348;
        }

        .code-section {
            background: #0f172a;
            border-radius: 16px;
            padding: 1.5rem 2rem;
            border: 1px solid #2d3a4f;
        }
        .code-section h3 {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
        .code-section h3 i {
            color: #294a95;
        }

        .code-tabs {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .code-tabs button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .code-tabs button.active {
            background: #475bbd;
            color: #ffffff;
        }
        .code-tabs button:hover:not(.active) {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .code-output {
            background: #0b111e;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: #e2e8f0;
            border: 1px solid #263348;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
        }

        .copy-row {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .copy-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 0.6rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }
        .copy-btn.secondary {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }
        .copy-btn.secondary:hover {
            background: #2d3a4f;
            color: #e2e8f0;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #38bdf8;
            color: #0f172a;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            opacity: 1;
        }

        .empty {
            text-align: center;
            padding: 3rem;
            color: #64748b;
            grid-column: 1 / -1;
        }
        .empty i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .stats {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .stats span {
            color: #38bdf8;
            font-weight: 600;
        }

        .category-label {
            grid-column: 1 / -1;
            color: #38bdf8;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.5rem 0 0.25rem 0;
            border-bottom: 1px solid #1e293b;
            margin-top: 0.5rem;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            }
            .code-output {
                font-size: 0.7rem;
                padding: 0.8rem;
            }
            .copy-row {
                flex-direction: column;
            }
            .copy-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fas fa-code"></i>
            SVG <span style="color:#3873f8;">Icons</span>
        </h1>

        <div class="search-box">
            <i class="fas fa-search" style="color:#64748b;"></i>
            <input type="text" id="searchInput" placeholder="Search...">
            <button id="searchBtn">Search</button>
        </div>

        <div class="stats">Total icons: <span id="totalCount">0</span></div>

        <div class="grid" id="iconGrid"></div>

        <div class="code-section">
            <h3><i class="fas fa-code"></i> SVG Code</h3>
            <div class="code-tabs">
                <button class="active" data-format="svg">SVG (Full)</button>
                <button data-format="svg-path">SVG (Path only)</button>
                <button data-format="html">HTML (Font Awesome)</button>
            </div>
            <div class="code-output" id="codeOutput">
                <i class="fas fa-hand-pointer"></i> Click on an icon above
            </div>
            <div class="copy-row">
                <button class="copy-btn" id="copyBtn"> Copy Code</button>
                <button class="copy-btn secondary" id="copyCpp"> Copy for C++ (raw string)</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied!</div>

            'Arrows & UI': ['arrow-right', 'arrow-left', 'arrow-up', 'arrow-down', 'chevron-right', 'chevron-left', 'chevron-up', 'chevron-down', 'bars', 'link', 'globe', 'camera', 'image', 'video', 'music', 'headphones', 'phone', 'print', 'share'],
            'Social': ['github', 'twitter', 'discord', 'telegram', 'whatsapp', 'facebook', 'youtube', 'instagram', 'linkedin', 'reddit', 'tiktok', 'snapchat', 'pinterest'],
            'Devices & Tech': ['wifi', 'bluetooth', 'battery-full', 'battery-half', 'battery-empty', 'plug', 'microchip', 'cpu', 'memory', 'hard-drive', 'network-wired', 'satellite', 'robot', 'gamepad', 'keyboard', 'mouse', 'display', 'laptop', 'mobile-screen-button', 'tablet-screen-button', 'printer'],

            'Power Buttons': ['power', 'power-filled', 'power-ios', 'power-neon', 'power-material'],
            'Remote Controls': ['remote-control', 'remote-control-alt', 'remote-control-circle', 'remote-control-mini', 'remote-control-slim', 'remote-control-dpad', 'remote-control-arrows', 'remote-control-touch', 'remote-control-vertical', 'remote-control-horizontal', 'remote-control-grid', 'remote-control-power', 'remote-control-smart'],
            'Media Controls': ['play', 'pause', 'stop', 'fast-forward', 'rewind', 'skip-forward', 'skip-backward', 'volume-up', 'volume-down', 'volume-mute', 'volume-off'],
            'Communication': ['chat', 'comment', 'message', 'send', 'inbox', 'outbox', 'reply', 'forward'],
            'E-commerce': ['cart', 'shopping-bag', 'credit-card', 'wallet', 'tag'],
            'Retail & Logistics': ['store', 'shop', 'warehouse', 'kiosk', 'stall', 'marketplace', 'delivery', 'truck', 'box', 'barcode', 'qr-code', 'cash-register', 'cart-plus'],
            'Weather & Nature': ['sun', 'moon', 'cloud-rain', 'cloud-snow', 'cloud-lightning', 'wind', 'thermometer', 'leaf'],
            'Health': ['heartbeat', 'pill', 'hospital', 'dna'],
            'Sports & Awards': ['trophy', 'medal', 'crown'],
            'Food': ['coffee', 'pizza', 'burger', 'cake', 'apple'],
            'Tools': ['wrench', 'scissors', 'hammer', 'compass'],
            'File Types': ['file-pdf', 'file-word', 'file-excel', 'file-zip', 'file-image', 'file-video', 'file-code'],
            'Location & Misc': ['location', 'map', 'pin', 'gift', 'fire', 'lightbulb', 'graduation-cap', 'building', 'trees', 'flower'],
        };

        const ICON_NAMES = Object.keys(ICON_SVGS);
        const grid = document.getElementById('iconGrid');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const codeOutput = document.getElementById('codeOutput');
        const copyBtn = document.getElementById('copyBtn');
        const copyCpp = document.getElementById('copyCpp');
        const tabs = document.querySelectorAll('.code-tabs button');
        const toast = document.getElementById('toast');
        const totalCount = document.getElementById('totalCount');

        let selectedIcon = 'power';
        let currentFormat = 'svg';

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function getSvgCode(name, format = 'svg') {
            const path = ICON_SVGS[name] || ICON_SVGS['home'];
            if (format === 'svg-path') {
                return path;
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">\n  <path d="${path}"/>\n</svg>`;
        }

        function renderIcons(filter = '') {
            const q = filter.toLowerCase().trim();
            let filteredNames = ICON_NAMES;

            if (q) {
                filteredNames = ICON_NAMES.filter(name => name.includes(q));
            }

            totalCount.textContent = filteredNames.length;

            if (filteredNames.length === 0) {
                grid.innerHTML = `<div class="empty"><i class="fas fa-face-frown"></i><p>No icons found</p></div>`;
                return;
            }

            if (q) {
                grid.innerHTML = filteredNames.map(name => `
                            <div class="icon-card ${name === selectedIcon ? 'selected' : ''}" data-name="${name}" onclick="selectIcon('${name}')">
                                ${getSvgCode(name)}
                                <span class="name">${name}</span>
                            </div>
                        `).join('');
                return;
            }

            let html = '';
            for (const [category, names] of Object.entries(ICON_GROUPS)) {
                const visibleNames = names.filter(n => ICON_SVGS[n]);
                if (visibleNames.length === 0) continue;
                html += `<div class="category-label">${category}</div>`;
                html += visibleNames.map(name => `
                            <div class="icon-card ${name === selectedIcon ? 'selected' : ''}" data-name="${name}" onclick="selectIcon('${name}')">
                                ${getSvgCode(name)}
                                <span class="name">${name}</span>
                            </div>
                        `).join('');
            }

            grid.innerHTML = html;
        }

        window.selectIcon = function(name) {
            selectedIcon = name;
            document.querySelectorAll('.icon-card').forEach(el => el.classList.remove('selected'));
            const card = document.querySelector(`[data-name="${name}"]`);
            if (card) card.classList.add('selected');
            updateCodeOutput();
            showToast('Selected: ' + name);
        };

        function updateCodeOutput() {
            let code = '';
            if (currentFormat === 'html') {
                code = `<i class="fas fa-${selectedIcon}"></i>`;
            } else {
                code = getSvgCode(selectedIcon, currentFormat);
            }
            codeOutput.textContent = code;
        }

        function copyCode() {
            const code = codeOutput.textContent;
            if (!code || code.includes('Click on an icon')) {
                showToast('Please select an icon first');
                return;
            }
            const input = document.createElement('input');
            input.value = code;
            input.style.position = 'fixed';
            input.style.left = '-9999px';
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('Copied!');
            } catch (err) {
                document.body.removeChild(input);
                showToast('Copy failed');
            }
        }

        function copyForCpp() {
            const code = codeOutput.textContent;
            if (!code || code.includes('Click on an icon')) {
                showToast('Please select an icon first');
                return;
            }
            const cppCode = `R"(${code})"`;
            const input = document.createElement('input');
            input.value = cppCode;
            input.style.position = 'fixed';
            input.style.left = '-9999px';
            document.body.appendChild(input);
            input.select();
            input.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('Copied for C++!');
            } catch (err) {
                document.body.removeChild(input);
                showToast('Copy failed');
            }
        }

        searchBtn.addEventListener('click', () => renderIcons(searchInput.value));
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') renderIcons(searchInput.value);
        });

        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFormat = this.dataset.format;
                if (selectedIcon) updateCodeOutput();
            });
        });

        copyBtn.addEventListener('click', copyCode);
        copyCpp.addEventListener('click', copyForCpp);

        renderIcons();
        setTimeout(() => {
            selectIcon('power');
        }, 50);
    </script>
